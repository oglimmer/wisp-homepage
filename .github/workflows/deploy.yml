name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve URLs
        id: base
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        # Nuxt wants a trailing slash; base_path is empty on the custom domain
        # (and "/wisp-homepage" if the site ever falls back to project pages).
        # base_url follows the Pages "enforce HTTPS" setting, so pin it to
        # https — crawlers should never see an http:// og:image.
        run: |
          echo "url=${BASE_PATH%/}/" >> "$GITHUB_OUTPUT"
          echo "site=${BASE_URL/#http:/https:}" >> "$GITHUB_OUTPUT"

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: ${{ steps.base.outputs.url }}
          # Full origin + path, so og:image can be absolute.
          NUXT_PUBLIC_SITE_URL: ${{ steps.base.outputs.site }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
